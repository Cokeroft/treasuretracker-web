<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TreasureTracker — One Piece Card Game Variant Guide</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/deck-builder.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
</head>
<body>

  <!-- ── Top bar ── -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        TreasureTracker
      </div>
      <div class="db-topbar-tabs">
        <span class="db-topbar-tab active">Browse</span>
        <a href="deck-builder.html" class="db-topbar-tab">Deck Builder</a>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search by name or card ID..." aria-label="Search cards">
      </div>
    </div>
  </header>

  <!-- ── Set selector panel ── -->
  <div class="set-panel" id="setPanel">
    <div class="set-panel-inner">
      <!-- Global row: All Sets + Collapse toggle -->
      <div class="set-global-row">
        <button class="set-all-btn global" id="setAllBtn">All Sets</button>
        <button class="set-collapse-btn" id="setCollapseBtn" title="Collapse set panel" aria-label="Collapse set panel">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
          <span>Collapse</span>
        </button>
      </div>
      <!-- Accordion groups — built by JS -->
      <div id="setAccordion"></div>
    </div>
  </div>

  <!-- ── Collapsed set bar (shown when panel is collapsed) ── -->
  <div class="set-collapsed-bar" id="setCollapsedBar" style="display:none">
    <div class="set-collapsed-inner">
      <span class="set-collapsed-label" id="setCollapsedLabel">OP01</span>
      <button class="set-expand-btn" id="setExpandBtn" title="Expand set panel" aria-label="Expand set panel">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        Sets
      </button>
    </div>
  </div>

  <!-- ── Hero ── -->
  <section class="hero">
    <h1 id="heroTitle">TreasureTracker</h1>
    <p id="heroSub" class="hero-sub">Loading...</p>
  </section>

  <!-- ── Filters ── -->
  <div class="filters-bar">
    <div class="filters-inner">
      <span class="filter-label">Color</span>
      <button class="filter-mode-btn" id="colorModeBtn" title="Switch between Any (OR) and All (AND) color matching">Any</button>
      <div class="pills" role="group" aria-label="Filter by color">
        <button class="pill active" data-group="color" data-value="all">All</button>
        <button class="pill" data-group="color" data-value="Red">Red</button>
        <button class="pill" data-group="color" data-value="Green">Green</button>
        <button class="pill" data-group="color" data-value="Blue">Blue</button>
        <button class="pill" data-group="color" data-value="Purple">Purple</button>
        <button class="pill" data-group="color" data-value="Black">Black</button>
        <button class="pill" data-group="color" data-value="Yellow">Yellow</button>
      </div>
      <span class="filter-label" style="margin-left:12px">Type</span>
      <div class="pills" role="group" aria-label="Filter by type">
        <button class="pill active" data-group="type" data-value="all">All</button>
        <button class="pill" data-group="type" data-value="Leader">Leader</button>
        <button class="pill" data-group="type" data-value="Character">Character</button>
        <button class="pill" data-group="type" data-value="Event">Event</button>
        <button class="pill" data-group="type" data-value="Stage">Stage</button>
      </div>
      <span class="filter-label" style="margin-left:12px">Rarity</span>
      <div class="pills" role="group" aria-label="Filter by rarity">
        <button class="pill active" data-group="rarity" data-value="all">All</button>
        <button class="pill" data-group="rarity" data-value="L">Leader</button>
        <button class="pill" data-group="rarity" data-value="C">C</button>
        <button class="pill" data-group="rarity" data-value="UC">UC</button>
        <button class="pill" data-group="rarity" data-value="R">R</button>
        <button class="pill" data-group="rarity" data-value="SR">SR</button>
        <button class="pill" data-group="rarity" data-value="SEC">SEC</button>
      </div>
      <span class="filter-label" style="margin-left:12px">Block</span>
      <div class="pills" role="group" aria-label="Filter by block">
        <button class="pill active" data-group="block" data-value="all">All</button>
        <button class="pill" data-group="block" data-value="1">1</button>
        <button class="pill" data-group="block" data-value="2">2</button>
        <button class="pill" data-group="block" data-value="3">3</button>
        <button class="pill" data-group="block" data-value="4">4</button>
      </div>
      <select id="sortSelect" class="sort-select" aria-label="Sort cards">
        <option value="id">Sort: Card #</option>
        <option value="variants">Most variants</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>

    <!-- ── Affiliation/type filter row ── -->
    <div class="filters-inner affiliation-row">
      <span class="filter-label">Subtype</span>
      <button class="filter-mode-btn" id="affilModeBtn" title="Switch between Any (OR) and All (AND) affiliation matching">Any</button>
      <div class="affil-search-wrap">
        <input type="text" id="affilInput" class="affil-input" placeholder="Type to search e.g. Straw Hat Crew, FILM..." autocomplete="off">
        <div id="affilDropdown" class="affil-dropdown" style="display:none"></div>
      </div>
      <div class="pills" id="affilChips" role="group" aria-label="Selected affiliations"></div>
    </div>
  </div>

  <!-- ── Main content ── -->
  <main class="main-content">
    <div id="loadingMsg" class="state-msg">
      <div class="spinner"></div>
      Loading cards...
    </div>
    <div id="errorMsg" class="state-msg error" style="display:none">
      Could not load cards. Make sure your API is running at:<br>
      <code id="apiUrlDisplay"></code>
    </div>
    <div id="emptyMsg" class="state-msg" style="display:none">
      No cards match your search.
    </div>
    <div id="comingSoon" class="state-msg coming-soon" style="display:none">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <div class="coming-soon-title">No sets selected</div>
      <div class="coming-soon-sub">Select one or more sets above to browse cards.</div>
    </div>
    <div id="cardGrid" class="card-grid" style="display:none"></div>
  </main>

  <!-- ── Detail Modal ── -->
  <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-label="Card detail" style="display:none">
    <button class="modal-nav-btn prev" id="modalPrevBtn" aria-label="Previous card" title="Previous card">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 class="modal-title" id="mTitle"></h2>
          <p class="modal-sub" id="mSub"></p>
        </div>
        <button class="close-btn" id="closeBtn" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="card-overview">
          <div class="main-img-wrap">
            <img id="mImg" src="" alt="" class="main-img" style="display:none">
            <div id="mImgPh" class="main-img-ph">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/></svg>
            </div>
          </div>
          <div class="card-attrs" id="mAttrs"></div>
        </div>
        <div class="effect-section" id="mEffectWrap" style="display:none">
          <div class="effect-label">Card effect</div>
          <p class="effect-text" id="mEffect"></p>
        </div>
        <h3 class="variants-heading" id="vHeading"></h3>
        <div class="variants-grid" id="vGrid"></div>
      </div>
    </div>
    <button class="modal-nav-btn next" id="modalNextBtn" aria-label="Next card" title="Next card">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
